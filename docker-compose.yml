services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payroll-backend
    restart: unless-stopped
    expose:
      - "8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: payroll-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend